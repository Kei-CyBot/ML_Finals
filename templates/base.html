<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShopSmart Analytics{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/" aria-label="ShopSmart Analytics home">
      <span class="logo">S</span>
      <span class="brand-copy">
        <strong>ShopSmart</strong>
        <small>Analytics</small>
      </span>
    </a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Home</a>
      <a href="/sales-forecast" class="{{ 'active' if request.path == '/sales-forecast' else '' }}">Sales Forecast</a>
      <a href="/sentiment" class="{{ 'active' if request.path == '/sentiment' else '' }}">Review Sentiment</a>
      <a href="/recommendations" class="{{ 'active' if request.path == '/recommendations' else '' }}">Product Recommendations</a>
      <a href="/purchase-likelihood" class="{{ 'active' if request.path == '/purchase-likelihood' else '' }}">Purchase Likelihood</a>
      <a href="/promo-response" class="{{ 'active' if request.path == '/promo-response' else '' }}">Promo Response</a>
      <a href="/purchase-probability" class="{{ 'active' if request.path == '/purchase-probability' else '' }}">Conversion Probability</a>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="container footer-inner">
    <span>ShopSmart Analytics</span>
    <span class="muted small">Flask + scikit-learn · sample data for demonstration</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
